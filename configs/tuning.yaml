study:
  name: resnet18-fashion-mnist
  direction: maximize
  n_trials: 30

search_space:

  learning_rate:
    type: float
    low: 0.00001
    high: 0.001
    log: true

  backbone_learning_rate:
    type: float
    low: 0.000001
    high: 0.0001
    log: true

  weight_decay:
    type: float
    low: 0.000001
    high: 0.001
    log: true

  batch_size:
    type: categorical
    choices: [32, 64, 128, 256]

  dropout:
    type: float
    low: 0.0
    high: 0.5

  optimizer:
    type: categorical
    choices:
      - adam
      - adamw
      - sgd