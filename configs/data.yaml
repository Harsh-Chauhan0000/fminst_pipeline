dataset:
  name: fashion_mnist
  root: data/raw
  download: true
  num_classes: 10

split:
  validation_size: 0.1
  random_state: 42

dataloader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

augmentation:
  enabled: true
  horizontal_flip:
    enabled: true
    probability: 0.5
  rotation:
    enabled: true
    degrees: 10

data_resnet18:
  image_size: 224
  image_channel: 3
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]